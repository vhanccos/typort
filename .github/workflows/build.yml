name: Build and Compile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: typort
            artifact_name: typort-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: typort
            artifact_name: typort-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: typort.exe
            artifact_name: typort-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ inputs.profile }}

      - name: Compile typort
        shell: bash
        run: |
          if [ "${{ inputs.profile }}" = "release" ]; then
            cargo build --release --bin typort
          else
            cargo build --bin typort
          fi

      - name: Stage binary artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ inputs.profile }}/${{ matrix.binary_name }}"
          cp "$BIN_PATH" "dist/${{ matrix.artifact_name }}"

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
